# Mendr audit — the reusable half of the one file a customer commits.
#
# Called by their `.github/workflows/mendr-audit.yml` (generated by the App; see
# app/src/ui/workflowTemplate.ts). The scan runs in THEIR CI, on their runner. Only
# the sanitized JSON (findings, paths, line numbers, classifications, redacted
# snippets, hashes) is sent to THEIR App — never their code — authenticated by the
# calling run's GitHub OIDC token, so there is no secret to store. The caller pins
# this file to a release tag; this file pins the CLI to the same release (bumped by
# the release checklist together with every other pin).
#
# NETWORK: besides fetching the pinned Mendr release (npx) and sending the JSON to
# the App, the scan makes ONE outbound GET of public, signed registry files from
# github.com (registry-refresh: 'on') so it audits against current retirement
# knowledge, not the knowledge of the day the release was cut. Nothing about the
# repository is sent by that request.
name: mendr audit (reusable)

on:
  workflow_call:
    inputs:
      app-url:
        description: "The customer's Mendr App — where the sanitized findings go."
        type: string
        required: true
      audience:
        description: "The OIDC audience the App verifies."
        type: string
        default: mendr
      mendr-spec:
        description: "The Mendr CLI ref to run: a tag, or a 40-char commit SHA. The calling repository's MENDR_SPEC variable overrides it."
        type: string
        default: v0.5.3-alpha
      registry-refresh:
        description: "'on' = one signed GET of public registry files so the audit uses current retirement knowledge; anything else = fully offline (a registry older than 14 days then makes a zero-finding result inconclusive)."
        type: string
        default: 'on'

jobs:
  audit:
    runs-on: ubuntu-latest
    # Least privilege, and never more than the caller granted: read the code to
    # scan it, and id-token to PROVE this run to the App. No write scopes, no secrets.
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: mendr-audit-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm 10 cannot install a git dependency pinned to a FULL 40-character commit SHA
      # when that package has a `prepare` script: it takes a shortcut for an
      # already-resolved commit-ish and dies with "GitFetcher requires an Arborist
      # constructor to pack a tarball". A 39-character prefix installs fine, which is how
      # the boundary was found. Node 22 still ships npm 10, and an immutable full SHA is
      # exactly what a customer is told to pin, so upgrade npm rather than ask anyone to
      # truncate a hash by one character. NODE is untouched: the customer's build and
      # tests still run on the version they chose.
      - name: Ensure npm can install a SHA-pinned dependency
        run: npm install -g npm@^11

      - name: Audit and send findings to Mendr
        env:
          MENDR_SPEC: ${{ vars.MENDR_SPEC || inputs.mendr-spec }}
          MENDR_APP_URL: ${{ inputs.app-url }}
          MENDR_AUDIENCE: ${{ inputs.audience }}
          MENDR_REGISTRY_REFRESH: ${{ inputs.registry-refresh }}
        run: |
          # Keep the audit's exit code (1 = scanner failure, 3 = inconclusive) so a
          # broken or inconclusive scan still fails this step — but only AFTER the
          # evidence has reached the App, so the dashboard shows this run as what
          # it is instead of a stale "last good run".
          set +e
          # Write the report OUTSIDE the scanned tree. The shell creates this file before mendr
          # starts, so redirecting into the repository root put mendr's own zero-byte output in
          # front of its own config scanner, which read it as malformed JSON and fail-closed.
          # Every clean repository therefore concluded `inconclusive`; it hid because a run WITH
          # findings concludes `exposure_detected` regardless.
          REPORT="$RUNNER_TEMP/mendr-audit.json"
          npx --yes "github:ajitheee/mendr#$MENDR_SPEC" audit . \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" --json > "$REPORT"
          MENDR_STATUS=$?
          set -e
          if [ -s "$REPORT" ]; then
            # Retries cover a sleeping (free-tier) App waking up and network blips;
            # the upload is idempotent per workflow run attempt, so a repeat is safe.
            TOKEN=$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$MENDR_AUDIENCE" | jq -r .value)
            curl -sS --fail-with-body --retry 4 --retry-delay 5 --retry-all-errors --max-time 120 -X POST "${MENDR_APP_URL%/}/api/ingest" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary @"$REPORT"
          fi
          exit $MENDR_STATUS
