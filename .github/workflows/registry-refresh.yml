# Weekly refresh of the two Plane 1 collectors that nothing was refreshing.
#
# `mendr catalog` and `mendr sdk-releases` have existed as CLI commands since
# slices 1 and 2, and no workflow ever invoked either one. They ran by hand, so
# registries/model-catalog.json and registries/sdk-releases.json sat frozen at
# 2026-09-17 while the deprecation registry moved weekly. A change-intelligence
# plane a human has to crank is a chore, not intelligence.
#
# WHAT MERGING THIS CHANGES, stated rather than implied. Unlike registry-discover,
# this is NOT inert. The catalog is what `mendr resolve` checks the end of a
# replacement chain against, and it ships in the signed feed for anyone reading
# it. (`candidates verify` and `promote` do not read this file; they fetch the
# same two sources live through oracles.ts, under the same rule below.) What it
# does NOT do is alter the active deprecation registry — llm-deprecations.json
# is the only file the fix engine reads, and the asserts below fail the job if
# this run touches it.
#
# The catalog's `providers` holds only ids the direct-provider source (models.dev)
# lists. Spellings only OpenRouter lists go to `openrouterOnly` (see
# src/registry/catalog.ts): they are reported in the PR body, never counted as
# new model ids, and never open a PR on their own.
name: registry-refresh

on:
  schedule:
    # Mondays 06:00 UTC. Deliberately not the 1st-of-month 07:00 that
    # registry-discover uses: two jobs opening registry PRs in the same hour
    # makes it harder to tell which one moved what.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Fail the collector on purpose, to prove the health alarm rings'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Both collectors read public third-party sources (OpenRouter, models.dev,
      # npm, PyPI). Either can fail without the other being wrong, so they are
      # separate steps and the run reports which one moved.
      # An alarm nobody has ever heard ring is not an alarm. This input exists so
      # the failure path below can be exercised on demand rather than first
      # running for real, months later, on the day it matters.
      - name: Simulate a collector failure (dispatch input only)
        if: inputs.simulate_failure
        run: |
          echo "simulate_failure was requested: failing on purpose to exercise the health alarm."
          exit 1

      - name: Refresh the model catalog
        run: node dist/cli.js catalog --write registries/model-catalog.json

      - name: Refresh the SDK release record
        run: node dist/cli.js sdk-releases --write registries/sdk-releases.json

      # Same invariant registry-discover asserts, for the same reason: the only
      # file that decides what mendr auto-applies must never move in an
      # automated PR. A diff here means a collector gained a write path it
      # should not have.
      - name: Assert the active registry was NOT touched
        run: |
          if ! git diff --quiet -- registries/llm-deprecations.json registries/candidates.json; then
            echo "INVARIANT VIOLATED: a collector modified the active registry or the candidate queue"
            git diff --stat -- registries/llm-deprecations.json registries/candidates.json
            exit 1
          fi
          echo "active registry and candidate queue untouched, as required."

      # `fetchedAt` changes on every run even when nothing else does, so a plain
      # `git diff --quiet` would open a PR every Monday saying nothing happened.
      # Compare the CONTENT that matters instead, and report real movement.
      #
      # The comparison is summarizeRefresh() in src/registry/refreshSummary.ts,
      # unit-tested there. It used to be inline here, where it keyed SDK versions
      # by package name alone, so PyPI `openai` overwrote npm `openai` and PR #40
      # reported 5 SDK bumps for a diff that made 6. Keys are ecosystem + name now.
      - name: What actually moved
        id: moved
        run: node scripts/refresh-summary.mjs

      # Nothing substantive means nothing to review. Revert rather than open a PR
      # whose entire diff is two timestamps — that is the Dependabot-churn failure
      # the whole product is built to avoid.
      - name: Drop a timestamp-only refresh
        if: steps.moved.outputs.substantive == 'no'
        run: |
          echo "only fetchedAt moved; discarding so no empty PR is opened."
          git checkout -- registries/model-catalog.json registries/sdk-releases.json

      - name: Open a review PR
        if: steps.moved.outputs.substantive == 'yes'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: registry/refresh-collectors
          base: main
          add-paths: |
            registries/model-catalog.json
            registries/sdk-releases.json
          commit-message: 'registry: refresh catalog and SDK record (${{ steps.moved.outputs.summary }})'
          title: 'registry: refresh catalog and SDK record (${{ steps.moved.outputs.summary }})'
          body-path: refresh-body.md

      # ---- health alarm ------------------------------------------------------
      # registry-discover's scheduled run failed on 2026-09-01 and nobody knew for
      # 27 days. A monthly job that fails silently is worse than no job: you
      # believe you have change intelligence and you do not. Zero of eight
      # workflows reported their own failure before this.
      #
      # ONE issue, found by its marker and edited in place forever, reopened when
      # it breaks again and closed when it recovers. Same discipline as the Mendr
      # Watch issue: the first duplicate is the start of the churn this product
      # exists to avoid. Duplicated verbatim into registry-discover.yml rather
      # than abstracted -- two copies is not yet a pattern.
      - name: Registry health — raise the alarm
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- mendr-registry-health:v1 -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const when = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const all = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', per_page: 100,
            });
            const issue = all.find((i) => !i.pull_request && (i.body || '').includes(MARKER));
            const body = [
              MARKER,
              '**A scheduled registry collector is failing.** Plane 1 is not refreshing itself.',
              '',
              `- workflow: \`${context.workflow}\``,
              `- last failure: ${when} UTC`,
              `- run: ${run}`,
              '',
              'While this is open, treat the model catalog, the SDK record and the candidate',
              'queue as **stale by an unknown amount**. A clean scan proves less than it looks.',
              '',
              'This issue closes itself on the next successful run of the same workflow.',
            ].join('\n');
            if (issue) {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body, state: 'open' });
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
                body: `Failed again — \`${context.workflow}\` at ${when} UTC. ${run}` });
            } else {
              await github.rest.issues.create({ ...context.repo,
                title: 'Registry collectors are failing', body });
            }

      - name: Registry health — stand down
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- mendr-registry-health:v1 -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const all = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const issue = all.find((i) => !i.pull_request && (i.body || '').includes(MARKER));
            if (!issue) return;
            await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
              body: `Recovered — \`${context.workflow}\` completed. ${run}` });
            await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
