# Weekly registry health check, in two parts.
#
# 1. INTEGRITY (offline, always): does the registry contradict itself? A
#    `verified` record with one of its proof switches off, an auto-appliable
#    record with a caveat written under it, a quarantine with no stated reason,
#    a missing/duplicated entryId. See scripts/validate-registry.mjs. This runs
#    first and needs no network, so nothing external can make it flake.
# 2. FRESHNESS (online, weekly): the public-oracle audit re-runs and the job
#    FAILS if any record that ships as `verified` no longer classifies as
#    verified — the exact regression that would let a stale replacement
#    auto-apply. Newly-added (never-verified) records do not fail the job: they
#    are already blocked from Tier A by the engine gate.
name: registry-verify

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # THE OFFLINE CHECK RUNS FIRST, and it is the one that must never be
      # skipped: it asks whether the registry contradicts ITSELF (a `verified`
      # record with a proof switched off, an auto-appliable record with a
      # caveat written under it, a quarantine with no stated reason, a missing
      # or duplicated entryId). No network, so nothing external can make it
      # flake — and a registry that fails here is broken regardless of what the
      # catalogs say today.
      - name: Validate registry integrity
        run: node scripts/validate-registry.mjs

      - name: Run the public-oracle audit
        run: node dist/cli.js verify-registry | tee verify-out.txt

      - name: Fail on regressions (previously-verified entries now unverified)
        run: |
          node -e '
            const fs = require("fs");
            // What the SHIPPED registry claims is verified...
            const reg = JSON.parse(fs.readFileSync("registries/llm-deprecations.json", "utf8"));
            const prevVerified = new Set(
              reg
                .filter((e) => e.kind === "model_id" && e.verification?.status === "verified")
                .map((e) => `${e.provider}: ${e.deprecated} -> ${e.replacement}`),
            );
            // ...vs what the audit just classified as NOT verified.
            const lines = fs.readFileSync("verify-out.txt", "utf8").split(/\r?\n/);
            const regressions = [];
            for (const line of lines) {
              const m = line.match(/^\[(UNVERIFIED|UNVERIFIABLE)\s*\]\s+(.+)$/);
              if (m && prevVerified.has(m[2].trim())) regressions.push(m[2].trim());
            }
            if (regressions.length > 0) {
              console.error(`registry regression: ${regressions.length} previously-verified entries no longer verify:`);
              for (const r of regressions) console.error(`  * ${r}`);
              console.error("run `mendr verify-registry --write` locally, review, and re-stamp the registry.");
              process.exit(1);
            }
            console.log("no regressions: every previously-verified entry still verifies.");
          '
