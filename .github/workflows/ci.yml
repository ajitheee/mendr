name: CI

# Push/PR gate: build, validate the deprecation registry offline, run the suite.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # A variable that is READ but never ASSIGNED is invisible to `bash -n`, which checks
  # syntax only. Under `set -u` it is fatal at runtime, and the action's scaffold runs
  # only in a customer's CI after a person has approved a migration -- the worst place
  # to discover it. That is not hypothetical: `PRBODY` was referenced and never defined,
  # so every migration pushed its branch and then died one line before opening the pull
  # request (mendr-demo, 2026-09-17, approval 5). No unit test could see it; shellcheck
  # reports it as SC2154.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the action scripts
        run: |
          shellcheck --version
          shellcheck mendr-action/scripts/*.sh

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate the deprecation registry (offline integrity)
        run: node scripts/validate-registry.mjs
      # Run test files sequentially: several tests spawn subprocesses, and on a
      # 2-core runner parallel files starve the event loop, delaying a kill-timer
      # past the per-test timeout. Slower, but stable.
      - run: npm test -- --no-file-parallelism

  # The GitHub App (app/) is its own package: no network in its tests either.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
