name: CI

# Push/PR gate: build, validate the deprecation registry offline, run the suite.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate the deprecation registry (offline integrity)
        run: node scripts/validate-registry.mjs
      - run: npm test
