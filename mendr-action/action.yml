name: "Mendr - migrate deprecated LLM model ids"
description: >-
  Scan a repo for retired LLM model ids and their coupled params, VERIFY the
  migration in an isolated sandbox (a baseline-relative type-check and build plus
  YOUR test suite, and an optional eval), and open one idempotent, human-approved
  pull request — only when the migration verifies. Mendr runs entirely inside
  YOUR CI runner, never edits your default branch, and never merges.
author: "Mendr"
branding:
  icon: "git-pull-request"
  color: "green"

inputs:
  working-directory:
    description: "Path to the repo/package root Mendr scans."
    required: false
    default: "."
  mendr-spec:
    description: "npm or GitHub spec for the Mendr CLI that runs in your CI (pins the version). Defaults to the pinned GitHub release; use an npm spec once the package is on the registry. Local specs must use the file: protocol (e.g. file:/path/to/mendr.tgz) — npm silently no-ops on raw absolute paths."
    required: false
    default: "github:ajitheee/mendr#v0.2.4-alpha"
  install-command:
    description: "Command to install the target repo's deps so Mendr's test gate can run. Empty = auto-detect from the lockfile."
    required: false
    default: ""
  node-version:
    description: "Node.js version (Mendr needs >=22; a dep uses Set.prototype.union)."
    required: false
    default: "22"
  branch:
    description: "Stable branch Mendr updates each run to keep a single idempotent PR."
    required: false
    default: "mendr/deprecated-model-ids"
  eval-command:
    description: "Optional command run in the sandbox as a BEHAVIORAL gate (e.g. an eval suite). Empty = no behavioral gate; the PR body says behavior is untested."
    required: false
    default: ""
  base:
    description: "Base branch for the PR. Empty = the repo's default branch."
    required: false
    default: ""
  pr-labels:
    description: "Comma-separated labels applied to the PR."
    required: false
    default: "dependencies,mendr,automated"
  github-token:
    description: "Token used to push the branch and open the PR. The default GITHUB_TOKEN is enough."
    required: false
    default: ${{ github.token }}

outputs:
  outcome:
    description: >-
      clean (nothing to migrate) | migration-proposed (a verified migration is in
      the PR) | not-verified (a migration exists but did not verify; nothing
      applied, no PR) | error (Mendr never completed a scan; the job fails red and
      no existing PR is touched)
    value: ${{ steps.mendr.outputs.outcome }}
  pr-url:
    description: "URL of the opened/updated PR (empty unless a verified migration was proposed)."
    value: ${{ steps.mendr.outputs.pr_url }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install target-repo dependencies (enables Mendr's test gate)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.install-command }}" ]; then
          eval "${{ inputs.install-command }}"
        elif [ -f pnpm-lock.yaml ]; then
          corepack enable && pnpm install --frozen-lockfile
        elif [ -f yarn.lock ]; then
          corepack enable && yarn install --frozen-lockfile
        elif [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Run Mendr and open a PR
      id: mendr
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MENDR_SPEC: ${{ inputs.mendr-spec }}
        MENDR_BRANCH: ${{ inputs.branch }}
        MENDR_BASE: ${{ inputs.base }}
        MENDR_LABELS: ${{ inputs.pr-labels }}
        MENDR_EVAL: ${{ inputs.eval-command }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-mendr.sh"
