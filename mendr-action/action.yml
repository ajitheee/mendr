name: "Mendr - migrate deprecated LLM model ids"
description: >-
  Scan a repo for retired LLM model ids and their coupled params, VERIFY the
  migration in an isolated sandbox (a baseline-relative type-check and build plus
  YOUR test suite, and an optional eval), and open one idempotent, human-approved
  pull request — only when the migration verifies. Mendr runs entirely inside
  YOUR CI runner and never edits your default branch. With `approval-gated`, it
  carries out exactly the migrations a person approved in your Mendr App.
author: "Mendr"
branding:
  icon: "git-pull-request"
  color: "green"

inputs:
  working-directory:
    description: "Path to the repo/package root Mendr scans."
    required: false
    default: "."
  mendr-spec:
    description: "npm or GitHub spec for the Mendr CLI that runs in your CI (pins the version). Defaults to the pinned GitHub release; use an npm spec once the package is on the registry. Local specs must use the file: protocol (e.g. file:/path/to/mendr.tgz) — npm silently no-ops on raw absolute paths."
    required: false
    default: "github:ajitheee/mendr#v0.4.5-alpha"
  install-command:
    description: "Command to install the target repo's deps so Mendr's test gate can run. Empty = auto-detect from the lockfile."
    required: false
    default: ""
  node-version:
    description: "Node.js version (Mendr needs >=22; a dep uses Set.prototype.union)."
    required: false
    default: "22"
  branch:
    description: "Stable branch Mendr updates each run to keep a single idempotent PR."
    required: false
    default: "mendr/deprecated-model-ids"
  eval-command:
    description: "Optional command run in the sandbox as a BEHAVIORAL gate (e.g. an eval suite). Empty = no behavioral gate; the PR body says behavior is untested."
    required: false
    default: ""
  base:
    description: "Base branch for the PR. Empty = the repo's default branch."
    required: false
    default: ""
  pr-labels:
    description: "Comma-separated labels applied to the PR."
    required: false
    default: "dependencies,mendr,automated"
  github-token:
    description: "Token used to push the branch and open the PR. The default GITHUB_TOKEN is enough."
    required: false
    default: ${{ github.token }}
  app-url:
    description: >-
      Your Mendr App URL (e.g. https://mendr-app.onrender.com). When set, the
      migration result is reported to it, proven by this run's GitHub OIDC token
      — the outcome, the PR url, the verdict, the gate statuses, the model swaps
      and the file paths they touch, and (see `send-diff`) the diff of the swap
      itself so the finding shows what changes. Never whole files. The calling
      workflow must grant `id-token: write`; without it nothing is sent and the
      job still succeeds. Empty = nothing is sent.
    required: false
    default: ""
  send-diff:
    description: >-
      "true" (default) = include the unified diff of the model-id swap in the
      report to your App, so the person who approved can see the change on the
      finding without opening GitHub (the App redacts secrets and caps it).
      "false" = report everything except the diff.
    required: false
    default: "true"
  approval-gated:
    description: >-
      "true" = carry out ONLY the migrations a person approved in your Mendr App
      (needs `app-url` and `id-token: write`): the run asks the App what is
      approved, claims it, migrates exactly those models, streams its progress
      to the App and, if the approval asked for it, enables auto-merge on the PR
      (a choice the App offers only when its operator enabled it; off in the beta).
      When nothing is approved the run ends in seconds and touches nothing.
      "false" (default) = migrate every verified swap, as before.
    required: false
    default: "false"
  approval:
    description: "The approval id the Mendr App passed when it started this workflow (workflow_dispatch input). Informational; every queued approval is picked up regardless."
    required: false
    default: ""

outputs:
  outcome:
    description: >-
      clean (nothing to migrate) | migration-proposed (a verified migration is in
      the PR) | not-verified (a migration exists but did not verify; nothing
      applied, no PR) | error (Mendr never completed a scan; the job fails red and
      no existing PR is touched) | empty when approval-gated and nothing was approved
    value: ${{ steps.mendr.outputs.outcome }}
  pr-url:
    description: "URL of the opened/updated PR (empty unless a verified migration was proposed)."
    value: ${{ steps.mendr.outputs.pr_url }}
  approvals:
    description: "Comma-separated ids of the App approvals this run carried out (approval-gated only)."
    value: ${{ steps.gate.outputs.ids }}

runs:
  using: "composite"
  steps:
    # Ask the customer's Mendr App what a person approved, and claim it. Runs
    # BEFORE any dependency install so an hourly check with nothing approved
    # costs seconds. Proven by this run's OIDC token, like every call to the App.
    - name: Check the Mendr App for approved migrations
      id: gate
      if: ${{ inputs.approval-gated == 'true' }}
      shell: bash
      env:
        MENDR_APP_URL: ${{ inputs.app-url }}
        MENDR_APPROVAL_HINT: ${{ inputs.approval }}
      run: |
        set -euo pipefail
        if [ -z "${MENDR_APP_URL:-}" ]; then echo "::error::Mendr: approval-gated needs app-url."; exit 1; fi
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::Mendr: approval-gated needs 'id-token: write' in the calling workflow."; exit 1
        fi
        token="$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mendr" | jq -r .value)"
        app="${MENDR_APP_URL%/}"
        list="$(curl -sS --fail-with-body --retry 4 --retry-delay 5 --retry-all-errors --max-time 60 -H "Authorization: Bearer $token" "$app/api/approvals")"
        ids="$(echo "$list" | jq -r '[.approvals[].id] | map(tostring) | join(",")')"
        if [ -z "$ids" ]; then
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "Mendr: nothing is approved in the App for this repository${MENDR_APPROVAL_HINT:+ (hint: $MENDR_APPROVAL_HINT)}; nothing to do."
          exit 0
        fi
        claimed="$(curl -sS --fail-with-body --retry 4 --retry-delay 5 --retry-all-errors --max-time 60 -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
          --data-binary "$(echo "$list" | jq -c '{ids: [.approvals[].id]}')" "$app/api/approvals/claim")"
        cids="$(echo "$claimed" | jq -r '[.claimed[].id] | map(tostring) | join(",")')"
        if [ -z "$cids" ]; then
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "Mendr: another run already took these approvals; nothing to do."
          exit 0
        fi
        only="$(echo "$claimed" | jq -r '[.claimed[] | "\(.provider)/\(.model)"] | join(",")')"
        mode="$(echo "$claimed" | jq -r 'if ([.claimed[].mode] | all(. == "auto-merge")) then "auto-merge" else "pr" end')"
        { echo "proceed=true"; echo "ids=$cids"; echo "only=$only"; echo "mode=$mode"; } >> "$GITHUB_OUTPUT"
        echo "Mendr: carrying out approval(s) $cids — $only ($mode)."

    - name: Set up Node.js
      if: ${{ inputs.approval-gated != 'true' || steps.gate.outputs.proceed == 'true' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install target-repo dependencies (enables Mendr's test gate)
      if: ${{ inputs.approval-gated != 'true' || steps.gate.outputs.proceed == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.install-command }}" ]; then
          eval "${{ inputs.install-command }}"
        elif [ -f pnpm-lock.yaml ]; then
          corepack enable && pnpm install --frozen-lockfile
        elif [ -f yarn.lock ]; then
          corepack enable && yarn install --frozen-lockfile
        elif [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Run Mendr and open a PR
      id: mendr
      if: ${{ inputs.approval-gated != 'true' || steps.gate.outputs.proceed == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MENDR_SPEC: ${{ inputs.mendr-spec }}
        MENDR_BRANCH: ${{ inputs.branch }}
        MENDR_BASE: ${{ inputs.base }}
        MENDR_LABELS: ${{ inputs.pr-labels }}
        MENDR_EVAL: ${{ inputs.eval-command }}
        MENDR_APP_URL: ${{ inputs.app-url }}
        MENDR_SEND_DIFF: ${{ inputs.send-diff }}
        MENDR_ONLY: ${{ steps.gate.outputs.only }}
        MENDR_APPROVAL_IDS: ${{ steps.gate.outputs.ids }}
        MENDR_MODE: ${{ steps.gate.outputs.mode }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-mendr.sh"
