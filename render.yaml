# Render blueprint for the Mendr GitHub App (the Node + Postgres service).
#
# This is SEPARATE from the marketing site on Vercel (vercel.json → site/). The
# static site does not have /setup or the API; this service does.
#
# Deploy: push this file, then in Render → "New" → "Blueprint" → pick this repo.
# Render provisions the Postgres database and the web service from app/Dockerfile,
# generates SESSION_SECRET, and links DATABASE_URL. You then set the values marked
# "set in dashboard" below. Full steps: app/DEPLOY.md.

databases:
  - name: mendr-db
    plan: free # 90-day free Postgres; upgrade before a real launch
    postgresMajorVersion: "16"

services:
  - type: web
    name: mendr-app
    runtime: docker
    dockerfilePath: ./app/Dockerfile
    dockerContext: . # build from repo root so the Dockerfile can COPY site/app
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Linked + generated automatically:
      - key: DATABASE_URL
        fromDatabase:
          name: mendr-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true # 32+ random chars; rotating it signs everyone out
      # Pin the CLI the scaffolded workflow runs (this release):
      - key: MENDR_CLI_SPEC
        value: v0.3.0-alpha
      # --- set in the Render dashboard (sync:false = not committed) ---
      # 1. Right after the FIRST deploy, set APP_URL to this service's public URL
      #    (e.g. https://mendr-app.onrender.com), then redeploy.
      - key: APP_URL
        sync: false
      # 2. Field-level encryption for stored findings. Generate one:
      #    node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: MENDR_DATA_KEY
        sync: false
      # 3. The six GitHub App credentials — set these AFTER opening APP_URL/setup,
      #    which creates the App on GitHub and prints them once. Then redeploy.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
