# Render blueprint for the Mendr GitHub App (the Node + Postgres service).
#
# This is SEPARATE from the marketing site on Vercel (vercel.json → site/). The
# static site has no /setup or API; this service does.
#
# Uses Render's NATIVE NODE runtime (no Docker) — Render checks out the repo,
# builds in app/, and runs the compiled server. Simpler and more reliable on the
# free tier than a Docker build. (app/Dockerfile still exists for local
# docker-compose and other hosts.)
#
# Deploy: Render → New → Blueprint → this repo. It provisions Postgres, builds
# the service, generates SESSION_SECRET, links DATABASE_URL. You then set the
# values marked "set in dashboard". Full steps: app/DEPLOY.md.

databases:
  - name: mendr-db
    plan: free # 90-day free Postgres; upgrade before a real launch
    postgresMajorVersion: "16"

services:
  - type: web
    name: mendr-app
    runtime: node
    rootDir: app # build + run inside app/; the whole repo is still checked out
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22" # a Mendr dep needs Node >= 22
      - key: UI_DIR
        value: ../site/app # serve the investigation workspace (repo/site/app)
      # Linked + generated automatically:
      - key: DATABASE_URL
        fromDatabase:
          name: mendr-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: MENDR_CLI_SPEC
        value: v0.4.0-alpha
      # --- set in the Render dashboard (sync:false = not committed) ---
      # 1. After the FIRST deploy, set APP_URL to this service's public URL
      #    (e.g. https://mendr-app.onrender.com), then redeploy.
      - key: APP_URL
        sync: false
      # 2. Field-level encryption key. Generate one:
      #    node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: MENDR_DATA_KEY
        sync: false
      # 3. The six GitHub App credentials — set AFTER opening APP_URL/setup,
      #    which creates the App on GitHub and prints them once. Then redeploy.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
