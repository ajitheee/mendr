# Render blueprint for the Mendr GitHub App (the Node service; Postgres is external).
#
# This is SEPARATE from the marketing site on Vercel (vercel.json → site/). The
# static site has no /setup or API; this service does.
#
# Uses Render's NATIVE NODE runtime (no Docker) — Render checks out the repo,
# builds in app/, and runs the compiled server. Simpler and more reliable on the
# free tier than a Docker build. (app/Dockerfile still exists for local
# docker-compose and other hosts.)
#
# Deploy: Render → New → Blueprint → this repo. It builds the service and
# generates SESSION_SECRET. It provisions NO database: Render's free Postgres
# expires 30 days after creation (then 14 days' grace, then deletion), so the
# App uses an external one. You then set the values marked "set in dashboard",
# DATABASE_URL first. Full steps: app/DEPLOY.md.

services:
  - type: web
    name: mendr-app
    runtime: node
    rootDir: app # build + run inside app/; the whole repo is still checked out
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22" # a Mendr dep needs Node >= 22
      # Generated automatically:
      - key: SESSION_SECRET
        generateValue: true
      # The CLI release the generated workflows pin to is compiled into the App
      # (app/src/config.ts MENDR_CLI_SPEC) and bumped with each release — no
      # environment variable, so a deployment can never hand out a stale pin.
      # --- set in the Render dashboard (sync:false = not committed) ---
      # 0. An external Postgres that does not expire (e.g. Neon's free plan):
      #    paste its connection string. Without it the App boots on the
      #    in-memory store and forgets everything on restart.
      - key: DATABASE_URL
        sync: false
      # 1. After the FIRST deploy, set APP_URL to this service's public URL
      #    (e.g. https://mendr-app.onrender.com), then redeploy.
      - key: APP_URL
        sync: false
      # 2. Field-level encryption key. Generate one:
      #    node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: MENDR_DATA_KEY
        sync: false
      # 3. The six GitHub App credentials — set AFTER opening APP_URL/setup,
      #    which creates the App on GitHub and prints them once. Then redeploy.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
